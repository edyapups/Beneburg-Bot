services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: deploy/server/deploy.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      ONLY_MAKE_MIGRATIONS: ${ONLY_MAKE_MIGRATIONS:-false}
      NO_AUTH: ${NO_AUTH:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      ADMIN_ID: ${ADMIN_ID:?ADMIN_ID is required}
      GROUP_ID: ${GROUP_ID:?GROUP_ID is required}
      INVITE_LINK: ${INVITE_LINK:-}
      DOMAIN: ${DOMAIN:-localhost}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-}
      JOB_RUNS_RETENTION_MONTHS: ${JOB_RUNS_RETENTION_MONTHS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-8081}:8080"

volumes:
  postgres_data: {}
